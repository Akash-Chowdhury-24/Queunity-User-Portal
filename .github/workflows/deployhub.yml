name: DeployHub
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (leave blank on push; use "all" for every enabled env)'
        required: false
        type: choice
        options:
          - default
          - all
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Install DeployHub CLI
        run: npm install @akash-chowdhury-24/deployhub@latest --no-save
      - name: Build (and auto-deploy push-triggered envs)
        run: node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js build
        env:
          DEPLOYHUB_ENV: default
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
          DOCKER_IMAGE_TAG: ${{ secrets.DOCKER_IMAGE_TAG }}
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_SSH_PORT: ${{ secrets.SSH_SSH_PORT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - name: Deploy (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYHUB_ENV: default
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
          DOCKER_IMAGE_TAG: ${{ secrets.DOCKER_IMAGE_TAG }}
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_SSH_PORT: ${{ secrets.SSH_SSH_PORT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          ENV_INPUT="${{ inputs.environment }}"
          if [ -z "$ENV_INPUT" ] || [ "$ENV_INPUT" = "all" ]; then
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js deploy --env all
          else
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js deploy --env "$ENV_INPUT"
          fi
